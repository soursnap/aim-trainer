<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Trainer</title>
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <main>
        <h1>Aim Trainer</h1>
        <div id="screen-container">
            <div id="choose-container">
                <h2>CHOOSE MODE</h2>
                <div id="choose-modes">
                    <div id="infinity-mode">
                        <img class="choose-avatar" src="images/choose-avatars/infinity.PNG" alt="Бесконечность">
                        <h3>WARM-UP</h3>
                        <p>Without timer</p>
                    </div>
                    <div id="timer-mode">
                        <img class="choose-avatar" src="images/choose-avatars/timer.PNG" alt="Таймер">
                        <h3>30 SEC</h3>
                        <p>Beat your record</p>
                    </div>
                </div>
            </div>
            <div id="game-container">
                <div id="stats">
                    <div id="score"></div>
                    <div id="misses"></div>
                    <div id="accuracy"></div>
                    <div id="timer"></div>
                </div>
                <div id="playfield"></div>
                <div id="game-control-buttons">
                    <button id="start-button">START</button>
                    <button id="finish-button">STOP</button>
                    <button id="quit-button">MAIN MENU</button>
                </div>
            </div>
            <div id="result-container">
                <div id="final-stats">
                    <div id="final-score"></div>
                    <div id="final-misses"></div>
                    <div id="final-accuracy"></div>
                    <div id="final-timer"></div>
                </div>
                <div id="result-buttons">
                    <button id="play-again-button">PLAY AGAIN</button>
                    <button id="main-menu-button">MAIN MENU</button>
                </div>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
